          for (var i = 0; i < nodes.length; i++) {
            var kind = nodes[i].getAttribute("data-year");
            nodes[i].textContent = kind === "gregorian" ? gregorian : jalali;
          }
        }

        function fixViewportHeight() {
          var set = function () { doc.documentElement.style.setProperty("--app-vh", window.innerHeight * 0.01 + "px"); };
          set();
          window.addEventListener("resize", set, { passive: true });
          window.addEventListener("orientationchange", set, { passive: true });
        }

        window.DiacoReady = function () {
          var loader = doc.getElementById("boot-loader");
          if (!loader) return;
          loader.classList.add("is-hidden");
          window.setTimeout(function () { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); }, 500);
        };

        function captureUtm() {
          try {
            var params = new URLSearchParams(window.location.search);
            var keys = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid"];
            var found = {}, has = false;
            keys.forEach(function (k) { var v = params.get(k); if (v) { found[k] = v; has = true; } });
            if (has) { sessionStorage.setItem("diaco_utm", JSON.stringify(found)); window.DIACO_UTM = found; }
          } catch (e) { }
        }

        injectYear();
        fixViewportHeight();
        captureUtm();

        window.addEventListener("load", function () {
          window.setTimeout(function () {
            if (doc.getElementById("root") && doc.getElementById("root").children.length) window.DiacoReady();
          }, 1200);
        });
        window.setTimeout(window.DiacoReady, 6000);
      })();
    </script>
  </head>
